name: Elbert

options:
  bundleIdPrefix: com.calebl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  # swift-fsrs is not depended on directly. It declares a class `FSRS` inside a
  # module `FSRS`, which makes `FSRS.Card` unreachable from any module that has
  # its own `Card` to disambiguate against, and Elbert has one. FSRSKit wraps it
  # and is also where the untagged upstream revision is pinned.
  FSRSKit:
    path: Packages/FSRSKit

targets:
  Elbert:
    type: application
    platform: iOS
    sources:
      - path: Elbert/App
      - path: Elbert/Design
      - path: Elbert/Models
      - path: Elbert/Engine
      - path: Elbert/Screens
      - path: Elbert/Resources
        buildPhase: resources
    dependencies:
      - package: FSRSKit
    info:
      path: Elbert/Info.plist
      properties:
        CFBundleDisplayName: Elbert
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIAppFonts:
          - DMSans.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebl.elbert
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # CloudKit is off until the iCloud container exists in the developer account
        # (spec section 10, item 1). Signing against an unregistered container fails, so
        # the entitlement cannot be attached early "just in case". To turn sync on,
        # uncomment both lines below and regenerate with `xcodegen generate`.
        # CODE_SIGN_ENTITLEMENTS: Elbert/Elbert.entitlements
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ELBERT_CLOUDKIT"

  ElbertTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Elbert/Tests/ElbertTests
    dependencies:
      - target: Elbert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebl.elbert.tests
        GENERATE_INFOPLIST_FILE: YES

  ElbertUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Elbert/Tests/ElbertUITests
    dependencies:
      - target: Elbert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebl.elbert.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Elbert:
    build:
      targets:
        Elbert: all
        ElbertTests: [test]
        ElbertUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElbertTests
        - ElbertUITests
